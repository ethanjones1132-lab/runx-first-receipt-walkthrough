name: Kai commissioned native Windows test
on: workflow_dispatch
permissions:
  contents: read
  id-token: write
  attestations: write
env:
  KAI_WORKER: '0xa3ea7075dff12255ffa675c0e541d5ed279f06e2'
jobs:
  profiler:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Disclosed test of Kai software
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py=(Get-Command python.exe -ErrorAction Stop).Source
          $w='kai_csv_profiler-0.2.4rc1-py3-none-any.whl'
          curl.exe --fail --location --proto '=https' --proto-redir '=https' --max-time 45 --max-filesize 11359 "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/$w" -o $w
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -c 'import base64,pathlib,zlib;pathlib.Path("probe.py").write_bytes(zlib.decompress(base64.b64decode("")))'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash probe.py -Algorithm SHA256).Hash.ToLower() -ne 'be4976b32e5e02535537e803298d122231e674f27f8cf8421dcc0913ea81b272') { throw 'Probe hash mismatch' }
          & $py probe.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Attest exact observation
        id: attest
        uses: actions/attest@60c80190bb1a4fb35e5724ede753db5656412b68
        with:
          subject-path: observation.json
          create-storage-record: false
      - name: Export signed capsule
        shell: pwsh
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          $ErrorActionPreference='Stop'
          python.exe -c 'import base64,json,os,pathlib; r=pathlib.Path("observation.json").read_bytes(); b=pathlib.Path(os.environ["ATTESTATION_BUNDLE"]).read_bytes(); assert 0<len(r)<=32768 and 0<len(b)<=49152; c={"schema":"kai-signed-observation-v1","report_base64":base64.b64encode(r).decode("ascii"),"bundle":json.loads(b)}; e=(json.dumps(c,sort_keys=True,separators=(",",":"))+"\n").encode("ascii"); assert len(e)<=98304; print("KAI_SIGNED_CAPSULE_BEGIN"); print(e.decode("ascii"),end=""); print("KAI_SIGNED_CAPSULE_END")'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
